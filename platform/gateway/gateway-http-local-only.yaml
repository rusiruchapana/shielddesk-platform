# LAB ONLY. Do not expose credentials over public plain HTTP.
apiVersion: v1
kind: Namespace
metadata: {name: platform-gateway}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: shielddesk-gateway, namespace: platform-gateway}
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces: {from: Selector, selector: {matchLabels: {shielddesk.gateway/allowed: "true"}}}
